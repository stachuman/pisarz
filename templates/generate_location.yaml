template_content: "Wygeneruj lokacje dla historii w formacie JSON. Wynik MUSI być\
  \ poprawną strukturą JSON.\n\n{% if project_description %}\nKontekst projektu: {{\
  \ project_description }}\n{% endif %}\n\n{% if scene_contexts %}\n{% set contexts_with_content\
  \ = scene_contexts|selectattr(\"has_content\")|list %}\n{% if contexts_with_content\
  \ %}\nKontekst historii z poprzednich scen:\n{% for context in contexts_with_content\
  \ %}\n- {{ context.scene_title }}: {{ context.content }}\n{% endfor %}\n{% endif\
  \ %}\n{% endif %}\n\n{% if locations %}\nIstniejące lokacje (unikaj duplikatów):\n\
  {% for location in locations %}\n- {{ location }}\n{% endfor %}\n{% endif %}\n\n\
  {% if characters %}\nPostacie występujące:\n{% for character in characters %}\n\
  - {{ character }}\n{% endfor %}\n{% endif %}\n\n{% if has_selection %}\n{{ selected_text\
  \ }}\n{% if scene_summary and scene_summary != selected_text %}\nKontekst sceny:\n\
  {{ scene_summary }}\n{% endif %}\n{% else %}\n{{ current_text }}\n{% endif %}\n\n\
  Format wyjściowy (tylko poprawny JSON):\n```json\n{\n  \"locations\": [\n    {\n\
  \      \"name\": \"Nazwa lokacji\",\n      \"type\": \"Indoor/Outdoor/Mixed/Virtual\"\
  ,\n      \"description\": \"Szczegółowy opis lokacji\",\n      \"atmosphere\": \"\
  Nastrój i klimat miejsca\",\n      \"details\": \"Konkretne szczegóły fizyczne i\
  \ cechy\",\n      \"significance\": \"Dlaczego ta lokacja jest ważna dla historii\"\
  ,\n      \"notes\": \"Dodatkowe notatki lub szczegóły\"\n    }\n  ]\n}\n```\n\n\
  Wygeneruj 1-3 szczegółowe lokacje na podstawie obecnej sceny i kontekstu historii.\
  \ Uczyń je żywe i atmosferyczne.\n"
