allow_context_editing: false
author: System
auto_apply_selection: true
category: writing
confirm_before_execution: false
created_date: null
custom_params: {}
default_context_length: 1000
description: Create a new scene based on context
format_version: '3.0'
max_context_chars: 3000
max_tokens: 800
modified_date: null
name: Create Scene
preview_length: 150
repeat_penalty: 1.05
scene_summary_length: 800
scene_summary_source: scene_beginning
selection_priority: true
show_context_preview: true
show_params_editor: true
tags:
- writing
- creation
- scene
temperature: 0.8
template_content: '{% if project_description %}

  Kontekst projektu: {{ project_description }}

  {% endif %}


  {% if has_selection %}

  Kontynuuj tę historię na podstawie zaznaczonego fragmentu:

  "{{ selected_text }}"


  {% if scene_summary and scene_summary != selected_text %}

  Kontekst sceny:

  {{ scene_summary }}

  {% endif %}

  {% else %}

  Kontynuuj tę scenę:

  {{ current_text }}


  {% if scene_summary and scene_summary != current_text %}

  Pełny kontekst sceny:

  {{ scene_summary }}

  {% endif %}

  {% endif %}


  {% if characters %}

  Postacie w scenie: {{ characters|join('', '') }}

  {% endif %}


  {% if locations %}

  Lokalizacje: {{ locations|join('', '') }}

  {% endif %}


  Napisz naturalną kontynuację (2-3 akapity), zachowując styl i ton tekstu:

  '
template_id: create_scene
top_k: 50
top_p: 0.95
use_selection: true
version: '2.0'
word_boundary_trim: true
