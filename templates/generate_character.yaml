template_content: "Wygeneruj postacie do książki w formacie JSON. Wynik MUSI być poprawną\
  \ strukturą JSON.\nGenerujesz TYLKO postacie.\n\n{% if project_description %}\n\
  Kontekst projektu: {{ project_description }}\n{% endif %}\n\n{% if scene_contexts\
  \ %}\n{% set contexts_with_content = scene_contexts|selectattr(\"has_content\")|list\
  \ %}\n{% if contexts_with_content %}\nKontekst historii z poprzednich scen:\n{%\
  \ for context in contexts_with_content %}\n- {{ context.scene_title }}: {{ context.content\
  \ }}\n{% endfor %}\n{% endif %}\n{% endif %}\n\n{% if characters %}\nIstniejące\
  \ postacie (unikaj duplikatów):\n{% for character in characters %}\n- {{ character\
  \ }}\n{% endfor %}\n{% endif %}\n\nFormat wyjściowy (tylko poprawny JSON):\n```json\n\
  {\n  \"characters\": [\n    {\n      \"name\": \"Nazwa wyświetlana postaci\",\n\
  \      \"full_name\": \"Pełne imię i nazwisko jeśli różne od name\",\n      \"alias\"\
  : \"Pseudonim lub przezwisko jeśli istnieje\", \n      \"age\": 25,\n      \"gender\"\
  : \"Mężczyzna/Kobieta/Inne\",\n      \"occupation\": \"Zawód lub rola postaci\"\
  ,\n      \"location\": \"Miejsce zamieszkania/pochodzenia\",\n      \"description\"\
  : \"Krótki opis postaci\",\n      \"personality\": \"Cechy osobowości i charakterystyka\"\
  , \n      \"background\": \"Historia i tło postaci\",\n      \"goals\": \"Co postać\
  \ chce osiągnąć\",\n      \"conflicts\": \"Konflikty wewnętrzne/zewnętrzne\",\n\
  \      \"relationships\": \"Kluczowe relacje z innymi postaciami\",\n      \"appearance\"\
  : \"Opis fizyczny\",\n      \"notes\": \"Dodatkowe notatki lub szczegóły\",\n  \
  \    \"importance\": 3,\n      \"is_protagonist\": false,\n      \"is_antagonist\"\
  : false\n    }\n  ]\n}\n```\n\nWygeneruj 1-3 szczegółowe postacie na podstawie obecnej\
  \ sceny i kontekstu historii. Uczyń je przekonującymi i dobrze rozwiniętymi.\n"
