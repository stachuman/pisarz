# Properly flattened template format v3.0
name: Continue Scene (Fixed)
template_id: continue_scene_fixed
description: Continue story with natural style and tone - fixed version
category: writing
version: '2.0'
author: System
created_date: null
modified_date: null
tags:
- writing
- continuation
- scene
- fixed
template_content: 'Kontynuuj tę historię, pisząc naturalnie w tym samym stylu i tonie.


  {% if has_selection %}

  Wybrany tekst do kontynuacji:

  {{ selected_text }}


  Kontekst sceny:

  {{ current_text }}

  {% else %}

  Tekst do kontynuacji:

  {{ current_text }}

  {% endif %}


  Napisz tylko kontynuację historii, bez komentarzy czy wyjaśnień. Tekst powinien
  płynnie nawiązywać do powyższego fragmentu.

  '
use_selection: true
selection_priority: true
default_context_length: 12000
scene_summary_length: 5000
scene_summary_source: scene_beginning
max_context_chars: 16000
word_boundary_trim: true
max_tokens: 8000
temperature: 0.75
top_p: 0.9
top_k: 40
repeat_penalty: 1.05
custom_params: {}
show_context_preview: true
allow_context_editing: false
preview_length: 150
show_params_editor: true
auto_apply_selection: true
confirm_before_execution: false
format_version: '3.0'
