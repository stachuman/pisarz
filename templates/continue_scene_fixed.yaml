context_config:
  default_context_length: 12000
  include_characters: true
  include_locations: true
  include_project_info: false
  max_context_chars: 16000
  scene_summary_length: 5000
  scene_summary_source: scene_beginning
  selection_priority: true
  use_selection: true
  word_boundary_trim: true
format_version: '2.0'
llm_params:
  custom_params: {}
  max_tokens: 8000
  repeat_penalty: 1.05
  temperature: 0.75
  top_k: 40
  top_p: 0.9
metadata:
  author: System
  category: writing
  created_date: null
  description: Continue story with natural style and tone - fixed version
  modified_date: null
  name: Continue Scene (Fixed)
  tags:
  - writing
  - continuation
  - scene
  - fixed
  template_id: continue_scene_fixed
  version: '2.0'
template_content: |
  Kontynuuj tę historię, pisząc naturalnie w tym samym stylu i tonie.

  {% if has_selection %}
  Wybrany tekst do kontynuacji:
  {{ selected_text }}

  Kontekst sceny:
  {{ current_text }}
  {% else %}
  Tekst do kontynuacji:
  {{ current_text }}
  {% endif %}

  Napisz tylko kontynuację historii, bez komentarzy czy wyjaśnień. Tekst powinien płynnie nawiązywać do powyższego fragmentu.
ui_config:
  allow_context_editing: false
  auto_apply_selection: true
  confirm_before_execution: false
  preview_length: 150
  show_context_preview: true
  show_params_editor: true