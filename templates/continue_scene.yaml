# Metadata fields
name: Continue Scene (Enhanced)
template_id: continue_scene
description: Continue writing the current scene with enhanced context and parameters
category: writing
version: '2.0'
author: System
created_date: null
modified_date: null
tags:
  - writing
  - continuation
  - scene

# Template content
template_content: |
  Kontynuuj tę scenę, pisząc naturalną kontynuację (2-3 akapity), zachowując styl i ton tekstu.

  {% if characters %}
  Postacie w scenie:
  {% for character in characters %}
  - {{ character }}
  {% endfor %}
  {% endif %}

  {% if locations %}
  Lokalizacje:
  {% for location in locations %}
  - {{ location }}
  {% endfor %}
  {% endif %}

  --- TEKST DO KONTYNUACJI ---

  {% if has_selection %}
  {{ selected_text }}

  {% if scene_summary and scene_summary != selected_text %}

  Dodatkowy kontekst sceny:
  {{ scene_summary }}
  {% endif %}

  {% else %}
  {{ current_text }}

  {% if scene_summary and scene_summary != current_text %}

  Pełny kontekst sceny:
  {{ scene_summary }}
  {% endif %}

  {% endif %}

# Context configuration
use_selection: true
selection_priority: true
default_context_length: 14000
scene_summary_length: 6000
scene_summary_source: scene_beginning
max_context_chars: 20000
word_boundary_trim: true

# LLM parameters
max_tokens: 10000
temperature: 0.8
top_p: 0.95
top_k: 50
repeat_penalty: 1.05
custom_params: {}

# UI configuration
show_context_preview: true
allow_context_editing: false
preview_length: 150
show_params_editor: true
auto_apply_selection: true
confirm_before_execution: false

# Format version
format_version: '3.0'