  use_selection: true
  word_boundary_trim: true
format_version: '2.0'
llm_params:
  custom_params: {}
  max_tokens: 512
  repeat_penalty: 1.1
  temperature: 0.7
  top_k: 40
  top_p: 0.9
metadata:
