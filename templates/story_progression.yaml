allow_context_editing: false
author: System
auto_apply_selection: false
category: writing
confirm_before_execution: false
created_date: null
custom_params: {}
default_context_length: 51200
description: Kontynuuj pisanie z świadomością ogólnego rozwoju fabuły i wątków
format_version: '3.0'
max_context_chars: 128000
max_tokens: 64000
modified_date: null
name: Kontynuacja z uwzględnieniem rozwoju fabuły
preview_length: 100
repeat_penalty: 1.15
scene_summary_length: 25600
scene_summary_source: full_scene
selection_priority: false
show_context_preview: false
show_params_editor: false
tags:
- rozwój-fabuły
- wątek-główny
- kontekst
temperature: 0.7
template_content: |
  Kontynuuj historię z pełną świadomością dotychczasowego rozwoju fabuły i postaci.
  
  {% if scene_contexts %}
  {% set contexts_with_content = scene_contexts|selectattr("has_content")|list %}
  **Pozycja:** Następna po {{ contexts_with_content|length }} scenach z kontekstem ({{ scene_contexts|length }} scen łącznie)
  
  {% if contexts_with_content|length >= 1 %}
  **Dotychczasowy rozwój fabuły:**
  {% for context in contexts_with_content %}
  {{ loop.index }}. {{ context.scene_title }}: {{ context.content }}
  {% endfor %}
  {% endif %}
  {% endif %}
  
  **Obecna scena:** {{ scene_title }}
  
  {% if characters %}
  **Postacie w tej scenie:** {{ characters|join(', ') }}
  {% endif %}
  
  {% if narrative_context %}
  **Ogólny kontekst narracyjny:** {{ narrative_context }}
  {% endif %}
  
  **Kontynuuj historię pamiętając o rozwoju fabuły i postaci:**
  {{ current_text }}
  
template_id: story_progression
top_k: 30
top_p: 0.8
use_selection: false
version: '2.0'
word_boundary_trim: true