# Properly flattened template format v3.0
name: Rewrite Scene
template_id: rewrite_scene
description: Rewrite the selected text with improved style and clarity
category: editing
version: '2.0'
author: System
created_date: null
modified_date: null
tags:
- editing
- rewrite
- improvement
template_content: 'Przepisz następujący fragment tekstu, poprawiając styl, płynność
  narracji i klarowność.


  Przepisz tekst zachowując:

  - Główną treść i wydarzenia

  - Charakter postaci

  - Klimat sceny

  - Długość zbliżoną do oryginału


  Popraw:

  - Styl i płynność

  - Dialogi (jeśli występują)

  - Opis akcji i emocji

  - Gramatykę i składnię


  {% if characters %}

  Postacie:

  {% for character in characters %}

  - {{ character }}

  {% endfor %}

  {% endif %}


  {% if locations %}

  Lokalizacje:

  {% for location in locations %}

  - {{ location }}

  {% endfor %}

  {% endif %}


  --- ORYGINALNY FRAGMENT ---


  {{ selected_text }}


  {% if scene_summary and scene_summary != selected_text %}


  Kontekst sceny:

  {{ scene_summary }}

  {% endif %}'
use_selection: true
selection_priority: true
default_context_length: 800
scene_summary_length: 600
scene_summary_source: selection
max_context_chars: 2500
word_boundary_trim: true
max_tokens: 1200
temperature: 0.7
top_p: 0.9
top_k: 40
repeat_penalty: 1.1
custom_params: {}
show_context_preview: true
allow_context_editing: true
preview_length: 200
show_params_editor: true
auto_apply_selection: true
confirm_before_execution: true
format_version: '3.0'
