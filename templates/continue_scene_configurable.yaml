template_content: 'Kontynuuj tę scenę, pisząc naturalną kontynuację, zachowując styl
  i ton tekstu.

  Utrzymuj styl pisania Gibsona . Zadbaj jednak o spójny i sensowny rozwój akcji.


  {% if characters %}

  Postacie w scenie:

  {% for character in characters %}

  - {{ character }}

  {% endfor %}

  {% endif %}


  {% if locations %}

  Lokalizacje:

  {% for location in locations %}

  - {{ location }}

  {% endfor %}

  {% endif %}


  --- TEKST DO KONTYNUACJI ---


  {% if has_selection %}

  {{ selected_text }}


  {% if scene_summary and scene_summary != selected_text %}


  Dodatkowy kontekst sceny:

  {{ scene_summary }}

  {% endif %}


  {% else %}

  {{ current_text }}


  {% if scene_summary and scene_summary != current_text %}


  Pełny kontekst sceny:

  {{ scene_summary }}

  {% endif %}


  {% endif %}'
