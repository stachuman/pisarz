context_config:
  default_context_length: 8000
  include_characters: true
  include_locations: true
  include_project_info: true
  max_context_chars: 25000
  scene_summary_length: 4000
  scene_summary_source: full_scene
  selection_priority: true
  use_selection: true
  word_boundary_trim: true
format_version: '2.0'
llm_params:
  custom_params: {}
  max_tokens: 8000
  repeat_penalty: 1.05
  temperature: 0.75
  top_k: 40
  top_p: 0.9
metadata:
  author: User
  category: writing
  created_date: null
  description: Continue writing with fully configurable text lengths and context sources
  modified_date: null
  name: Continue Scene (Configurable)
  tags:
  - writing
  - continuation
  - scene
  - configurable
  template_id: continue_scene_configurable
  version: '2.0'
template_content: 'Kontynuuj tę scenę, pisząc naturalną kontynuację (2-3 akapity),
  zachowując styl i ton tekstu.


  {% if characters %}

  Postacie w scenie:

  {% for character in characters %}

  - {{ character }}

  {% endfor %}

  {% endif %}


  {% if locations %}

  Lokalizacje:

  {% for location in locations %}

  - {{ location }}

  {% endfor %}

  {% endif %}


  --- TEKST DO KONTYNUACJI ---


  {% if has_selection %}

  {{ selected_text }}


  {% if scene_summary and scene_summary != selected_text %}


  Dodatkowy kontekst sceny:

  {{ scene_summary }}

  {% endif %}


  {% else %}

  {{ current_text }}


  {% if scene_summary and scene_summary != current_text %}


  Pełny kontekst sceny:

  {{ scene_summary }}

  {% endif %}


  {% endif %}'
ui_config:
  allow_context_editing: true
  auto_apply_selection: true
  confirm_before_execution: false
  preview_length: 200
  show_context_preview: true
  show_params_editor: true
