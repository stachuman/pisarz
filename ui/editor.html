<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { 
            font-family: 'Liberation Serif', 'Times New Roman', serif; 
            font-size: 14px; 
            margin: 10px; 
            outline: none;
        }
        #editor { 
            min-height: 400px; 
            border: none; 
            outline: none;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="editor" contenteditable="true">
        <p>Start writing your scene...</p>
    </div>
    <script>
        function getContent() {
            return document.getElementById('editor').innerHTML;
        }
        
        function setContent(html) {
            document.getElementById('editor').innerHTML = html;
        }
        
        function setFontSize(size) {
            var selection = window.getSelection();
            if (selection.rangeCount > 0) {
                var range = selection.getRangeAt(0);
                if (!range.collapsed) {
                    // Apply to selected text
                    var span = document.createElement('span');
                    span.style.fontSize = size;
                    try {
                        range.surroundContents(span);
                    } catch(e) {
                        // If can't surround (crossing element boundaries), extract and wrap
                        var contents = range.extractContents();
                        span.appendChild(contents);
                        range.insertNode(span);
                    }
                } else {
                    // Apply to cursor position for new text
                    document.execCommand('fontSize', false, '3');
                    // Find the font element and replace with span
                    var fontEl = document.querySelector('font[size="3"]');
                    if (fontEl) {
                        var span = document.createElement('span');
                        span.style.fontSize = size;
                        span.innerHTML = fontEl.innerHTML;
                        fontEl.parentNode.replaceChild(span, fontEl);
                    }
                }
            }
            document.getElementById('editor').focus();
            markChanged();
        }
        
        function setFontFamily(fontFamily) {
            var selection = window.getSelection();
            if (selection.rangeCount > 0) {
                var range = selection.getRangeAt(0);
                if (!range.collapsed) {
                    // Apply to selected text
                    var span = document.createElement('span');
                    span.style.fontFamily = fontFamily;
                    try {
                        range.surroundContents(span);
                    } catch(e) {
                        // If can't surround (crossing element boundaries), extract and wrap
                        var contents = range.extractContents();
                        span.appendChild(contents);
                        range.insertNode(span);
                    }
                } else {
                    // Apply to cursor position for new text
                    document.execCommand('fontName', false, fontFamily);
                }
            }
            document.getElementById('editor').focus();
            markChanged();
        }
        
        // Track changes for save status
        let hasChanges = false;
        
        function markChanged() {
            if (!hasChanges) {
                hasChanges = true;
            }
        }
        
        function resetChanges() {
            hasChanges = false;
        }
        
        function getHasChanges() {
            return hasChanges;
        }
        
        // Add change tracking
        document.addEventListener('DOMContentLoaded', function() {
            const editor = document.getElementById('editor');
            editor.addEventListener('input', markChanged);
            editor.addEventListener('keydown', function(event) {
                if (event.ctrlKey) {
                    switch(event.key.toLowerCase()) {
                        case 's':
                            event.preventDefault();
                            console.log('save-requested');
                            return false;
                        case 'b':
                            event.preventDefault();
                            document.execCommand('bold');
                            return false;
                        case 'i':
                            event.preventDefault();
                            document.execCommand('italic');
                            return false;
                        case 'u':
                            event.preventDefault();
                            document.execCommand('underline');
                            return false;
                        case 'l':
                            event.preventDefault();
                            document.execCommand('justifyLeft');
                            return false;
                        case 'e':
                            event.preventDefault();
                            document.execCommand('justifyCenter');
                            return false;
                        case 'r':
                            event.preventDefault();
                            document.execCommand('justifyRight');
                            return false;
                        case 'j':
                            event.preventDefault();
                            document.execCommand('justifyFull');
                            return false;
                    }
                }
            });
            
            // Auto-focus the editor
            editor.focus();
        });
    </script>
</body>
</html>
